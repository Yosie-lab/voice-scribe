<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Whisper live bench</title>
</head>
<body>
<pre id="out">starting</pre>
<script src="/js/whisper-live-text.js"></script>
<script type="module">
const out = document.getElementById('out');
const params = new URLSearchParams(location.search);
const modelKey = params.get('model') || 'tiny';
const result = {
  model: modelKey,
  online: navigator.onLine,
  crossOriginIsolated: self.crossOriginIsolated === true,
  webgpu: typeof navigator.gpu !== 'undefined',
  sw: false,
  device: '',
  loadMs: null,
  chunks: [],
  error: null
};

function show(extra) {
  out.textContent = JSON.stringify(Object.assign({}, result, extra || {}), null, 2);
}

function wavToFloat(buffer) {
  const view = new DataView(buffer);
  let offset = 12;
  while (offset + 8 <= view.byteLength) {
    const id = String.fromCharCode(
      view.getUint8(offset),
      view.getUint8(offset + 1),
      view.getUint8(offset + 2),
      view.getUint8(offset + 3)
    );
    const size = view.getUint32(offset + 4, true);
    if (id === 'data') {
      const samples = Math.floor(size / 2);
      const pcm = new Float32Array(samples);
      const start = offset + 8;
      for (let i = 0; i < samples; i++) pcm[i] = view.getInt16(start + i * 2, true) / 32768;
      return pcm;
    }
    offset += 8 + size + (size % 2);
  }
  throw new Error('wav data chunk missing');
}

try {
  const reg = await navigator.serviceWorker.register('/sw.js');
  await navigator.serviceWorker.ready;
  if (!navigator.serviceWorker.controller && reg.active) {
    await new Promise((resolve) => {
      const timer = setTimeout(resolve, 1500);
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        clearTimeout(timer);
        resolve();
      }, { once: true });
    });
  }
  result.sw = !!navigator.serviceWorker.controller;
  show();

  const info = window.WhisperLiveText.modelInfo(modelKey);
  const worker = new Worker(new URL('/js/whisper-live-worker.js?v=96', location.href), { type: 'module' });
  const loadStarted = performance.now();
  const ready = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('load timeout')), 240000);
    worker.onmessage = (event) => {
      const msg = event.data || {};
      if (msg.type === 'progress' || msg.type === 'status') {
        result.status = msg.text || msg.status || msg.file || '';
        show();
      }
      if (msg.type === 'ready') {
        clearTimeout(timer);
        result.device = msg.device || result.device;
        result.fallback = msg.fallback || result.fallback;
        if (msg.webgpuReason) result.webgpuReason = msg.webgpuReason;
        if (result.loadMs == null) result.loadMs = Math.round(performance.now() - loadStarted);
        resolve();
      }
      if (msg.type === 'error' && !msg.id) {
        clearTimeout(timer);
        reject(new Error(msg.message || 'load failed'));
      }
    };
    worker.onerror = (event) => {
      clearTimeout(timer);
      reject(new Error(event.message || 'worker error'));
    };
  });
  worker.postMessage({ type: 'load', modelId: info.id });
  await ready;
  show();

  const wav = await fetch('/tools/fixtures/ja-live.wav').then((res) => {
    if (!res.ok) throw new Error('wav ' + res.status);
    return res.arrayBuffer();
  });
  const pcm = wavToFloat(wav);
  const windows = [
    { name: '0-4s', pcm: pcm.slice(0, 16000 * 4) }
  ];
  if (pcm.length > 16000 * 4) {
    windows.push({ name: 'overlap-tail', pcm: pcm.slice(16000) });
  }

  for (const windowPcm of windows) {
    const audioSec = windowPcm.pcm.length / 16000;
    const started = performance.now();
    const text = await new Promise((resolve, reject) => {
      const id = windowPcm.name;
      const timer = setTimeout(() => reject(new Error('infer timeout ' + id)), 180000);
      const onMessage = (event) => {
        const msg = event.data || {};
        if (msg.type === 'text' && msg.id === id) {
          clearTimeout(timer);
          worker.removeEventListener('message', onMessage);
          result.device = msg.device || result.device;
          resolve(msg.text || '');
        }
        if (msg.type === 'error' && msg.id === id) {
          clearTimeout(timer);
          worker.removeEventListener('message', onMessage);
          reject(new Error(msg.message || 'infer failed'));
        }
      };
      worker.addEventListener('message', onMessage);
      const copy = windowPcm.pcm.slice();
      worker.postMessage({
        type: 'transcribe',
        id,
        session: 1,
        modelId: info.id,
        language: 'ja',
        pcm: copy
      }, [copy.buffer]);
    });
    const inferMs = Math.round(performance.now() - started);
    result.chunks.push({
      name: windowPcm.name,
      audioSec: Math.round(audioSec * 100) / 100,
      inferMs,
      rtf: Math.round((inferMs / 1000 / audioSec) * 100) / 100,
      text
    });
    show();
  }

  await Promise.all([
    fetch(location.href),
    fetch('/js/whisper-live-worker.js?v=96'),
    fetch('/js/whisper-live-text.js')
  ].map((p) => p.catch(() => null)));
  result.done = true;
  out.dataset.done = '1';
  show();
} catch (error) {
  result.error = error && error.message ? error.message : String(error);
  result.done = true;
  out.dataset.done = '1';
  show();
}
</script>
</body>
</html>
