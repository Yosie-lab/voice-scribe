<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="VoiceScribe — リアルタイム文字起こし機能付きボイスレコーダー。日本語・英語対応。録音しながらリアルタイムでテキスト化。">
  <meta name="theme-color" content="#6c3ce0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VoiceScribe">

  <title>VoiceScribe — 文字起こしボイスレコーダー</title>

  <!-- PWAマニフェスト -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- スタイルシート -->
  <link rel="stylesheet" href="css/style.css">

  <!-- ファビコン -->
  <link rel="icon" href="icons/icon-192.png" type="image/png">
</head>
<body>
  <div id="app">

    <!-- ===== ヘッダー ===== -->
    <header class="app-header">
      <div class="app-logo">
        <span class="app-logo-icon">🎙️</span>
        <span>VoiceScribe</span>
      </div>
      <div class="header-actions">
        <!-- 将来の拡張用 -->
      </div>
    </header>

    <!-- ===== 録音ビュー ===== -->
    <main id="view-record" class="view record-view active">

      <!-- トップステータスバー（言語・タイマー・波形・文字数） -->
      <div class="live-status-bar" id="live-status-bar">
        <div class="status-left">
          <!-- 言語セレクター -->
          <div class="language-selector compact" id="language-selector">
            <button class="lang-btn active" data-lang="ja-JP" id="lang-btn-ja">🇯🇵 JP</button>
            <button class="lang-btn" data-lang="en-US" id="lang-btn-en">🇺🇸 EN</button>
          </div>
          <!-- ライブ状態バッジ -->
          <div class="live-badge" id="live-badge">
            <span class="live-dot"></span>
            <span class="live-label">STANDBY</span>
          </div>
        </div>

        <div class="status-center">
          <div class="timer-display compact" id="timer-display">00:00</div>
        </div>

        <div class="status-right">
          <div class="text-stats" id="text-stats">
            <span id="char-count">0</span>文字
          </div>
          <!-- 文字サイズ調整 -->
          <div class="font-size-controls">
            <button class="font-btn" id="font-decrease-btn" title="文字を小さく">A-</button>
            <button class="font-btn" id="font-increase-btn" title="文字を大きく">A+</button>
          </div>
        </div>
      </div>

      <!-- 文字起こし非対応メッセージ -->
      <div class="transcript-unsupported" id="transcript-unsupported">
        <span>⚠️</span>
        <span class="unsupported-msg">文字起こし機能はSafariブラウザ内でご利用ください。</span>
      </div>

      <!-- メイン文字起こしエリア（大画面ライブテレプロンプター） -->
      <div class="transcript-area prominent" id="transcript-area">
        <div class="transcript-header-bar">
          <span class="transcript-title-label">📝 リアルタイム文字起こし</span>
          <button class="clear-transcript-btn" id="clear-transcript-btn" title="クリア" style="display:none;">クリア</button>
        </div>

        <!-- リアルタイムテキスト表示部 -->
        <div class="transcript-content-wrapper" id="transcript-content-wrapper">
          <div class="transcript-placeholder prominent" id="transcript-placeholder">
            <div class="placeholder-icon">🎙️</div>
            <div class="placeholder-main">下の録音ボタンを押して話し始めてください</div>
            <div class="placeholder-sub">話した言葉がここにリアルタイムでそのまま大きく表示されます</div>
          </div>
          <div class="transcript-text prominent" id="transcript-text"></div>
        </div>

        <!-- アクティブ発話インジケーター -->
        <div class="speaking-indicator" id="speaking-indicator">
          <span class="sound-wave-bar"></span>
          <span class="sound-wave-bar"></span>
          <span class="sound-wave-bar"></span>
          <span class="speaking-text">音声を聞き取り中...</span>
        </div>
      </div>

      <!-- 下部コントロールデッキ（波形ミニバー + 録音ボタン + 操作） -->
      <div class="bottom-control-deck" id="bottom-control-deck">
        <!-- ミニ波形ビジュアライザー -->
        <div class="visualizer-container compact" id="visualizer-container">
          <canvas class="visualizer-canvas" id="visualizer-canvas"></canvas>
        </div>

        <!-- アクションボタンエリア -->
        <div class="deck-actions">
          <!-- 一時停止ボタン -->
          <button class="control-btn mini" id="pause-btn" aria-label="一時停止/再開" style="visibility:hidden;">⏸️</button>

          <!-- メイン録音ボタン -->
          <div class="record-btn-wrapper prominent" id="record-btn-wrapper">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <button class="record-btn prominent" id="record-btn" aria-label="録音開始/停止">
              <span class="btn-icon-mic">🎙️</span>
              <span class="btn-icon-stop">⏹️</span>
            </button>
          </div>

          <!-- コピーボタン -->
          <button class="control-btn mini" id="quick-copy-btn" aria-label="テキストをコピー" title="テキストをコピー">📋</button>
        </div>
      </div>
    </main>

    <!-- ===== 録音一覧ビュー ===== -->
    <section id="view-list" class="view list-view">

      <!-- 検索バー -->
      <div class="search-bar" id="search-bar">
        <span class="search-icon">🔍</span>
        <input
          type="search"
          class="search-input"
          id="search-input"
          placeholder="テキストで検索..."
          autocomplete="off"
        >
      </div>

      <!-- 録音件数 -->
      <div class="recordings-count" id="recordings-count">0 件の録音</div>

      <!-- 録音カード一覧 -->
      <div class="recordings-list" id="recordings-list">
        <div class="empty-state">
          <div class="empty-state-icon">🎙️</div>
          <div class="empty-state-title">録音がありません</div>
          <div class="empty-state-desc">録音タブで録音を開始してみましょう</div>
        </div>
      </div>
    </section>

    <!-- ===== 録音詳細ビュー ===== -->
    <section id="view-detail" class="view detail-view">

      <!-- 詳細ヘッダー -->
      <div class="detail-header">
        <button class="back-btn" id="back-btn" aria-label="戻る">←</button>
        <div class="detail-title-area">
          <h1 class="detail-title" id="detail-title">録音</h1>
          <div class="detail-date" id="detail-date"></div>
        </div>
      </div>

      <!-- オーディオプレイヤー -->
      <div class="player-card" id="player-card">
        <div class="player-waveform" id="player-waveform">
          <canvas id="player-waveform-canvas"></canvas>
        </div>
        <div class="player-time">
          <span id="player-current-time">00:00</span>
          <span id="player-total-time">00:00</span>
        </div>
        <div class="player-progress" id="player-progress">
          <div class="player-progress-fill" id="player-progress-fill"></div>
        </div>
        <div class="player-controls">
          <button class="skip-btn" id="skip-back-btn" aria-label="10秒戻る">⏪</button>
          <button class="play-btn" id="play-btn" aria-label="再生/一時停止">▶️</button>
          <button class="skip-btn" id="skip-fwd-btn" aria-label="10秒進める">⏩</button>
        </div>
      </div>

      <!-- 文字起こしテキスト -->
      <div class="detail-transcript" id="detail-transcript">
        <div class="detail-transcript-header">
          <div class="detail-transcript-title">
            📝 文字起こしテキスト
          </div>
          <div class="export-actions">
            <button class="export-btn" id="export-text-btn">📄 テキスト</button>
            <button class="export-btn" id="export-audio-btn">🎵 音声</button>
          </div>
        </div>
        <div class="detail-transcript-text" id="detail-transcript-text">
          テキストなし
        </div>
      </div>
    </section>

    <!-- ===== 下部ナビゲーション ===== -->
    <nav class="nav-bar" id="nav-bar">
      <button class="nav-item active" data-view="record" id="nav-record">
        <span class="nav-icon">🎙️</span>
        <span>録音</span>
      </button>
      <button class="nav-item" data-view="list" id="nav-list">
        <span class="nav-icon">📂</span>
        <span>一覧</span>
      </button>
    </nav>

    <!-- ===== トースト通知コンテナ ===== -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ===== 確認モーダル ===== -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-card">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">確認</div>
        <div class="modal-desc">この操作を実行しますか？</div>
        <div class="modal-actions">
          <button class="modal-btn">キャンセル</button>
          <button class="modal-btn danger">削除する</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ===== JavaScript モジュール ===== -->
  <script src="js/storage.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/transcriber.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
