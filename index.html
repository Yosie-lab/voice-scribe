<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="VoiceScribe — リアルタイム文字起こし機能付きボイスレコーダー。日本語・英語対応。録音しながらリアルタイムでテキスト化。">
  <meta name="theme-color" content="#6c3ce0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VoiceScribe">

  <title>VoiceScribe — 文字起こしボイスレコーダー</title>

  <!-- PWAマニフェスト -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- スタイルシート -->
  <link rel="stylesheet" href="css/style.css">

  <!-- ファビコン -->
  <link rel="icon" href="icons/icon-192.png" type="image/png">
</head>
<body>
  <div id="app">

    <!-- ===== ヘッダー ===== -->
    <header class="app-header">
      <div class="app-logo">
        <span class="app-logo-icon">🎙️</span>
        <span>VoiceScribe</span>
      </div>
      <div class="header-actions">
        <!-- 将来の拡張用 -->
      </div>
    </header>

    <!-- ===== 録音ビュー ===== -->
    <main id="view-record" class="view record-view active">

      <!-- 言語セレクター -->
      <div class="language-selector" id="language-selector">
        <button class="lang-btn active" data-lang="ja-JP" id="lang-btn-ja">
          🇯🇵 日本語
        </button>
        <button class="lang-btn" data-lang="en-US" id="lang-btn-en">
          🇺🇸 English
        </button>
      </div>

      <!-- 波形ビジュアライザー -->
      <div class="visualizer-container" id="visualizer-container">
        <canvas class="visualizer-canvas" id="visualizer-canvas"></canvas>
      </div>

      <!-- タイマー -->
      <div class="timer-display" id="timer-display">00:00</div>

      <!-- 録音ボタン -->
      <div class="record-btn-wrapper" id="record-btn-wrapper">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <button class="record-btn" id="record-btn" aria-label="録音開始/停止">
          <span class="btn-icon-mic">🎙️</span>
          <span class="btn-icon-stop">⏹️</span>
        </button>
      </div>

      <!-- 録音コントロール（録音中のみ表示） -->
      <div class="record-controls" id="record-controls">
        <button class="control-btn" id="pause-btn" aria-label="一時停止/再開">⏸️</button>
      </div>

      <!-- 文字起こし非対応メッセージ -->
      <div class="transcript-unsupported" id="transcript-unsupported">
        <span>⚠️</span>
        <span class="unsupported-msg">文字起こし機能は利用できません。</span>
      </div>

      <!-- リアルタイム文字起こしテキスト -->
      <div class="transcript-area" id="transcript-area">
        <div class="transcript-placeholder" id="transcript-placeholder">
          録音を開始すると、ここにリアルタイムで文字起こしが表示されます
        </div>
        <div class="transcript-text" id="transcript-text"></div>
      </div>
    </main>

    <!-- ===== 録音一覧ビュー ===== -->
    <section id="view-list" class="view list-view">

      <!-- 検索バー -->
      <div class="search-bar" id="search-bar">
        <span class="search-icon">🔍</span>
        <input
          type="search"
          class="search-input"
          id="search-input"
          placeholder="テキストで検索..."
          autocomplete="off"
        >
      </div>

      <!-- 録音件数 -->
      <div class="recordings-count" id="recordings-count">0 件の録音</div>

      <!-- 録音カード一覧 -->
      <div class="recordings-list" id="recordings-list">
        <div class="empty-state">
          <div class="empty-state-icon">🎙️</div>
          <div class="empty-state-title">録音がありません</div>
          <div class="empty-state-desc">録音タブで録音を開始してみましょう</div>
        </div>
      </div>
    </section>

    <!-- ===== 録音詳細ビュー ===== -->
    <section id="view-detail" class="view detail-view">

      <!-- 詳細ヘッダー -->
      <div class="detail-header">
        <button class="back-btn" id="back-btn" aria-label="戻る">←</button>
        <div class="detail-title-area">
          <h1 class="detail-title" id="detail-title">録音</h1>
          <div class="detail-date" id="detail-date"></div>
        </div>
      </div>

      <!-- オーディオプレイヤー -->
      <div class="player-card" id="player-card">
        <div class="player-waveform" id="player-waveform">
          <canvas id="player-waveform-canvas"></canvas>
        </div>
        <div class="player-time">
          <span id="player-current-time">00:00</span>
          <span id="player-total-time">00:00</span>
        </div>
        <div class="player-progress" id="player-progress">
          <div class="player-progress-fill" id="player-progress-fill"></div>
        </div>
        <div class="player-controls">
          <button class="skip-btn" id="skip-back-btn" aria-label="10秒戻る">⏪</button>
          <button class="play-btn" id="play-btn" aria-label="再生/一時停止">▶️</button>
          <button class="skip-btn" id="skip-fwd-btn" aria-label="10秒進める">⏩</button>
        </div>
      </div>

      <!-- 文字起こしテキスト -->
      <div class="detail-transcript" id="detail-transcript">
        <div class="detail-transcript-header">
          <div class="detail-transcript-title">
            📝 文字起こしテキスト
          </div>
          <div class="export-actions">
            <button class="export-btn" id="export-text-btn">📄 テキスト</button>
            <button class="export-btn" id="export-audio-btn">🎵 音声</button>
          </div>
        </div>
        <div class="detail-transcript-text" id="detail-transcript-text">
          テキストなし
        </div>
      </div>
    </section>

    <!-- ===== 下部ナビゲーション ===== -->
    <nav class="nav-bar" id="nav-bar">
      <button class="nav-item active" data-view="record" id="nav-record">
        <span class="nav-icon">🎙️</span>
        <span>録音</span>
      </button>
      <button class="nav-item" data-view="list" id="nav-list">
        <span class="nav-icon">📂</span>
        <span>一覧</span>
      </button>
    </nav>

    <!-- ===== トースト通知コンテナ ===== -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ===== 確認モーダル ===== -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-card">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">確認</div>
        <div class="modal-desc">この操作を実行しますか？</div>
        <div class="modal-actions">
          <button class="modal-btn">キャンセル</button>
          <button class="modal-btn danger">削除する</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ===== JavaScript モジュール ===== -->
  <script src="js/storage.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/transcriber.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
